<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Sombra suave para dar volumen -->
    <filter id="fruit-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Gradiente de la cáscara exterior de maracuyá -->
    <linearGradient id="rind-grad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gradiente de la pulpa dorada y jugosa -->
    <radialGradient id="pulp-grad" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </radialGradient>

    <!-- Gradiente de la hoja verde fresca -->
    <linearGradient id="leaf-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <!-- Gradiente de las semillas características -->
    <radialGradient id="seed-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4B5563" />
      <stop offset="70%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </radialGradient>
  </defs>

  <!-- Hoja superior decorativa -->
  <g id="leaf-group">
    <path d="M36 14 C36 14, 45 4, 55 7 C55 17, 46 25, 36 21 Z" fill="url(#leaf-grad)" />
    <!-- Nervadura de la hoja -->
    <path d="M38 18 C44 14, 49 11, 53 8" stroke="#14532D" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Tallo pequeño -->
    <path d="M33 22 C34 18, 36 15, 38 14" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Fruta principal de Maracuyá -->
  <g filter="url(#fruit-shadow)">
    <!-- Cáscara exterior dorada -->
    <circle cx="31" cy="35" r="24" fill="url(#rind-grad)" stroke="#B45309" stroke-width="1.2" />

    <!-- Capa interna blanca/crema característica (albedo) -->
    <circle cx="31" cy="35" r="21" fill="#FEF9C3" opacity="0.95" />

    <!-- Pulpa central jugosa -->
    <circle cx="31" cy="35" r="18.5" fill="url(#pulp-grad)" />

    <!-- Brillo sutil de frescura en la pulpa -->
    <ellipse cx="26" cy="27" rx="8" ry="4" transform="rotate(-30 26 27)" fill="#FFFFFF" opacity="0.35" />

    <!-- Semillas de maracuyá con arilos (pepitas oscuras con relieve) -->
    <!-- Semilla 1 -->
    <ellipse cx="25" cy="31" rx="3.2" ry="2.1" transform="rotate(-25 25 31)" fill="url(#seed-grad)" />
    <circle cx="24.2" cy="30.2" r="0.6" fill="#FFFFFF" opacity="0.8" />

    <!-- Semilla 2 -->
    <ellipse cx="34" cy="28" rx="3.3" ry="2" transform="rotate(35 34 28)" fill="url(#seed-grad)" />
    <circle cx="33.3" cy="27.2" r="0.6" fill="#FFFFFF" opacity="0.8" />

    <!-- Semilla 3 -->
    <ellipse cx="28" cy="40" rx="3.4" ry="2.2" transform="rotate(15 28 40)" fill="url(#seed-grad)" />
    <circle cx="27.2" cy="39.2" r="0.6" fill="#FFFFFF" opacity="0.8" />

    <!-- Semilla 4 -->
    <ellipse cx="37" cy="38" rx="3.1" ry="2" transform="rotate(-40 37 38)" fill="url(#seed-grad)" />
    <circle cx="36.2" cy="37.2" r="0.6" fill="#FFFFFF" opacity="0.8" />

    <!-- Semilla 5 (centro) -->
    <ellipse cx="31" cy="34" rx="3.5" ry="2.2" transform="rotate(70 31 34)" fill="url(#seed-grad)" />
    <circle cx="30.2" cy="33.2" r="0.7" fill="#FFFFFF" opacity="0.8" />

    <!-- Semilla 6 (pequeña periférica) -->
    <ellipse cx="20" cy="37" rx="2.5" ry="1.6" transform="rotate(45 20 37)" fill="url(#seed-grad)" opacity="0.9" />

    <!-- Semilla 7 (pequeña superior) -->
    <ellipse cx="28" cy="24" rx="2.6" ry="1.7" transform="rotate(-15 28 24)" fill="url(#seed-grad)" opacity="0.9" />
  </g>
</svg>